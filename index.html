<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face skin tone fix</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;--bg:#f5f5f7;--fg:#1c1c1e;--card:#ffffff;--line:#d4d4da;--accent:#2f6fed;--muted:#6b6b72}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--fg:#f2f2f4;--card:#1e1e22;--line:#38383f;--accent:#6b9bff;--muted:#9c9ca5}}
:root[data-theme="dark"]{--bg:#141416;--fg:#f2f2f4;--card:#1e1e22;--line:#38383f;--accent:#6b9bff;--muted:#9c9ca5}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:20px;margin:0 0 4px}
.intro{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.lbl{display:block;font-weight:600;margin-bottom:8px}
input[type=file],select,input[type=color]{width:100%;font:inherit;color:var(--fg)}
select{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
input[type=color]{height:44px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input[type=range]{width:100%}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600}
button:disabled{opacity:.4}
.muted{color:var(--muted);font-size:14px;margin:8px 0 0}
.hide{display:none}
#out{display:block;max-width:100%;height:auto;margin:8px auto 0;border-radius:8px}
#save{margin-top:12px}
#cv{display:none}
</style>
</head>
<body>
<h1>Face skin tone fix</h1>
<p class="intro">Corrects a face that comes out too dark or too pale by matching its skin to a reference.</p>

<div class="card">
  <label class="lbl" for="face">1. Face PNG to fix</label>
  <input type="file" id="face" accept="image/*">
</div>

<div class="card">
  <label class="lbl" for="mode">2. Match skin tone to</label>
  <select id="mode">
    <option value="ref">A reference face that looks right</option>
    <option value="color">A skin color</option>
  </select>
  <div id="refBox" style="margin-top:10px">
    <input type="file" id="ref" accept="image/*">
  </div>
  <div id="colorBox" class="hide" style="margin-top:10px">
    <input type="color" id="color" value="#c68c6a">
  </div>
</div>

<div class="card">
  <label class="lbl" for="strength">3. Strength: <span id="sv">100</span>%</label>
  <input type="range" id="strength" min="0" max="100" value="100">
  <label class="lbl" for="even" style="margin-top:14px">Evenness: <span id="ev">100</span>%</label>
  <input type="range" id="even" min="0" max="100" value="100">
  <div style="margin-top:12px"><button id="go" disabled>Fix skin tone</button></div>
  <p class="muted" id="status">Choose a face PNG to start.</p>
</div>

<div class="card hide" id="result">
  <img id="out" alt="Corrected face">
  <button id="save">Save PNG</button>
</div>

<canvas id="cv"></canvas>

<script>
const $ = id => document.getElementById(id);
const SIZES = [128, 256, 512, 1024];
const LIN = Array.from({length: 256}, (_, i) => {
  const v = i / 255;
  return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
});
let faceEl = null, refEl = null;

function setMsg(msg) { $("status").textContent = msg; }

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not open " + file.name)); };
    img.src = url;
  });
}

function readPixels(img) {
  const c = $("cv");
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const g = c.getContext("2d", {willReadFrequently: true});
  g.drawImage(img, 0, 0);
  return g.getImageData(0, 0, c.width, c.height);
}

// sRGB <-> CIE Lab (D65)
function toLab(r, g, b) {
  const R = LIN[r | 0], G = LIN[g | 0], B = LIN[b | 0];
  const X = (R * 0.4124564 + G * 0.3575761 + B * 0.1804375) / 0.95047;
  const Y = R * 0.2126729 + G * 0.7151522 + B * 0.0721750;
  const Z = (R * 0.0193339 + G * 0.1191920 + B * 0.9503041) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const fx = f(X), fy = f(Y), fz = f(Z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}

function toRgb(L, a, b) {
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  const finv = t => t * t * t > 0.008856 ? t * t * t : (t - 16 / 116) / 7.787;
  const X = finv(fx) * 0.95047, Y = finv(fy), Z = finv(fz) * 1.08883;
  const lin = [
    3.2404542 * X - 1.5371385 * Y - 0.4985314 * Z,
    -0.9692660 * X + 1.8760108 * Y + 0.0415560 * Z,
    0.0556434 * X - 0.2040259 * Y + 1.0572252 * Z
  ];
  return lin.map(v => {
    v = Math.min(1, Math.max(0, v));
    const s = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
    return Math.round(s * 255);
  });
}

// Rough skin detection in YCbCr space
function isSkin(r, g, b) {
  const Y  = 0.299 * r + 0.587 * g + 0.114 * b;
  const Cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
  const Cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
  return Y > 30 && Cb >= 77 && Cb <= 127 && Cr >= 133 && Cr <= 173;
}

// Finds skin pixels and returns their average Lab color
function analyze(img) {
  const d = img.data, n = d.length >> 2;
  const mask = new Float32Array(n);
  let opaque = 0, skin = 0;
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    if (d[o + 3] < 96) continue;
    opaque++;
    if (isSkin(d[o], d[o + 1], d[o + 2])) { mask[i] = 1; skin++; }
  }
  if (skin < opaque * 0.05) {
    // Too little skin-colored area detected: use every solid pixel instead
    for (let i = 0; i < n; i++) mask[i] = d[i * 4 + 3] >= 96 ? 1 : 0;
  }
  let L = 0, a = 0, b = 0, c = 0;
  for (let i = 0; i < n; i++) {
    if (!mask[i]) continue;
    const o = i * 4, lab = toLab(d[o], d[o + 1], d[o + 2]);
    L += lab[0]; a += lab[1]; b += lab[2]; c++;
  }
  if (!c) throw new Error("No solid pixels found in that image.");
  return { mask, mean: [L / c, a / c, b / c] };
}

// Separable box blur so the correction fades out at the edge of the skin area
function blur(src, w, h, r) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, c = 0;
    for (let k = Math.max(0, x - r); k <= Math.min(w - 1, x + r); k++) { s += src[y * w + k]; c++; }
    tmp[y * w + x] = s / c;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, c = 0;
    for (let k = Math.max(0, y - r); k <= Math.min(h - 1, y + r); k++) { s += tmp[k * w + x]; c++; }
    out[y * w + x] = s / c;
  }
  return out;
}

// Shifts skin pixels in Lab so their average moves from 'from' to 'to'
function correct(img, weight, from, to, strength) {
  const d = img.data, n = d.length >> 2;
  const dL = to[0] - from[0], da = to[1] - from[1], db = to[2] - from[2];
  for (let i = 0; i < n; i++) {
    const o = i * 4, k = weight[i] * strength;
    if (k < 0.001 || d[o + 3] === 0) continue;
    const lab = toLab(d[o], d[o + 1], d[o + 2]);
    const rgb = toRgb(Math.min(100, Math.max(0, lab[0] + dL * k)), lab[1] + da * k, lab[2] + db * k);
    d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2];
  }
}

// Box blur using running sums: each pixel becomes the average of its neighbourhood within radius r
function boxBlur(src, w, h, r) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  const P = new Float64Array(Math.max(w, h) + 1);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) P[x + 1] = P[x] + src[y * w + x];
    for (let x = 0; x < w; x++) {
      const lo = Math.max(0, x - r), hi = Math.min(w - 1, x + r);
      tmp[y * w + x] = (P[hi + 1] - P[lo]) / (hi - lo + 1);
    }
  }
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) P[y + 1] = P[y] + tmp[y * w + x];
    for (let y = 0; y < h; y++) {
      const lo = Math.max(0, y - r), hi = Math.min(h - 1, y + r);
      out[y * w + x] = (P[hi + 1] - P[lo]) / (hi - lo + 1);
    }
  }
  return out;
}

// Shifts skin toward the target color, and pulls each spot toward the skin tone around it.
// evenness 0 = uniform shift only; 1 = spots fully blend into their surroundings.
function correctEven(img, mask, weight, from, to, strength, evenness) {
  const d = img.data, n = d.length >> 2, w = img.width, h = img.height;
  const span = Math.max(w, h);
  const rColor = Math.max(3, Math.round(span * 0.12));
  const rLight = Math.max(6, Math.round(span * 0.25));
  const LAB = [new Float32Array(n), new Float32Array(n), new Float32Array(n)];
  for (let i = 0; i < n; i++) {
    if (!mask[i]) continue;
    const o = i * 4, lab = toLab(d[o], d[o + 1], d[o + 2]);
    LAB[0][i] = lab[0]; LAB[1][i] = lab[1]; LAB[2][i] = lab[2];
  }
  const denC = boxBlur(mask, w, h, rColor), denL = boxBlur(mask, w, h, rLight);
  const field = (ch, r, den, fallback) => {
    const num = boxBlur(ch, w, h, r);
    for (let i = 0; i < n; i++) num[i] = den[i] > 0.001 ? num[i] / den[i] : fallback;
    return num;
  };
  const FL = field(LAB[0], rLight, denL, from[0]);
  const Fa = field(LAB[1], rColor, denC, from[1]);
  const Fb = field(LAB[2], rColor, denC, from[2]);
  const shift = [to[0] - from[0], to[1] - from[1], to[2] - from[2]];
  for (let i = 0; i < n; i++) {
    const k = weight[i] * strength, o = i * 4;
    if (k < 0.001 || d[o + 3] === 0) continue;
    const lab = toLab(d[o], d[o + 1], d[o + 2]);
    // only pull colors that already look like skin; lips and strongly colored spots keep their own color
    const off = Math.max(Math.abs(lab[1] - from[1]), Math.abs(lab[2] - from[2]));
    const gate = Math.max(0, Math.min(1, 1 - (off - 8) / 8)) * evenness;
    const L = Math.min(100, Math.max(0, lab[0] + k * (shift[0] + gate * (FL[i] - lab[0]))));
    const a = lab[1] + k * (shift[1] + gate * (Fa[i] - lab[1]));
    const b = lab[2] + k * (shift[2] + gate * (Fb[i] - lab[2]));
    const rgb = toRgb(L, a, b);
    d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2];
  }
}

function hexToLab(hex) {
  return toLab(parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16));
}

function updateReady() {
  const ready = !!(faceEl && ($("mode").value === "color" || refEl));
  $("go").disabled = !ready;
  if (faceEl && !ready) setMsg("Next: choose a reference face below, or switch to a skin color. Then press Fix skin tone.");
}

$("face").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    faceEl = await loadImage(file);
    const w = faceEl.naturalWidth, h = faceEl.naturalHeight;
    setMsg(SIZES.includes(w) && w === h
      ? `Loaded ${file.name} (${w}×${h}).`
      : `Loaded ${file.name} (${w}×${h}). Face textures are usually square at 128, 256, 512 or 1024 pixels. The fix will still run.`);
  } catch (err) {
    faceEl = null;
    setMsg(err.message);
  }
  updateReady();
};

$("ref").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    refEl = await loadImage(file);
    setMsg(`Reference: ${file.name}.`);
  } catch (err) {
    refEl = null;
    setMsg(err.message);
  }
  updateReady();
};

$("mode").onchange = () => {
  const useRef = $("mode").value === "ref";
  $("refBox").classList.toggle("hide", !useRef);
  $("colorBox").classList.toggle("hide", useRef);
  updateReady();
};

$("strength").oninput = () => { $("sv").textContent = $("strength").value; };
$("even").oninput = () => { $("ev").textContent = $("even").value; };

$("go").onclick = async () => {
  $("go").disabled = true;
  setMsg("Working…");
  await new Promise(r => setTimeout(r, 30));
  try {
    const img = readPixels(faceEl);
    const src = analyze(img);
    const target = $("mode").value === "ref"
      ? analyze(readPixels(refEl)).mean
      : hexToLab($("color").value);
    const strength = $("strength").value / 100;
    const weight = blur(src.mask, img.width, img.height, 3);
    correctEven(img, src.mask, weight, src.mean, target, strength, $("even").value / 100);
    const c = $("cv");
    c.width = img.width;
    c.height = img.height;
    c.getContext("2d").putImageData(img, 0, 0);
    $("out").src = c.toDataURL("image/png");
    $("result").classList.remove("hide");
    $("result").scrollIntoView({behavior: "smooth", block: "start"});
    setMsg(`Average skin brightness: ${src.mean[0].toFixed(0)} before, target ${target[0].toFixed(0)}.`);
  } catch (err) {
    setMsg(err.message);
  }
  updateReady();
};
$("save").onclick = () => {
  const url = $("out").src;
  if (window.AndroidBridge) { AndroidBridge.savePng(url); return; }
  const a = document.createElement("a");
  a.href = url; a.download = "face-fixed.png"; a.click();
};
</script>
</body>
</html>
